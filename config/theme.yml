name: ado_hummingbird
display_name: ADO Hummingbird
version: 0.2.0

author:
  name: "Marco Giuliani | IT di ADO Medical s.r.l."
  email: "webmaster@adomedical.it"
  url: "https://www.adomedical.it"

parent: hummingbird

meta:
  compatibility:
    from: 9.1.0
    to: ~
    framework: bootstrap-v5.3.3

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and two side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column.
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column.

assets:
  use_parent_assets: true

global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
    HOME_FEATURED_NBR: 4
    NEW_PRODUCTS_NBR: 4
    BLOCKSPECIALS_SPECIALS_NBR: 4
    PS_BLOCK_BESTSELLERS_TO_DISPLAY: 4
    PRODUCTS_VIEWED_NBR: 4
    CATEGORYPRODUCTS_DISPLAY_PRODUCTS: 4
    PSR_ICON_COLOR: "#0b69f6"
    PSR_TEXT_COLOR: "#212529"

  hooks:
    custom_hooks:
      - name: displayHeaderActions
        title: displayHeaderActions
        description: Header actions area for language, account, cart and related modules

      - name: displayHeaderSearchLinks
        title: displayHeaderSearchLinks
        description: Small links shown below the desktop search bar

  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [products]
    small_default:
      width: 98
      height: 98
      scope: [products, categories, manufacturers, suppliers]
    medium_default:
      width: 452
      height: 452
      scope: [products, manufacturers, suppliers]
    large_default:
      width: 800
      height: 800
      scope: [products, manufacturers, suppliers]
    home_default:
      width: 250
      height: 250
      scope: [products]
    category_default:
      width: 180
      height: 180
      scope: [categories]
    stores_default:
      width: 287
      height: 160
      scope: [stores]
    default_xs:
      width: 160
      height: 160
      scope: [products, manufacturers, suppliers, categories]
    default_sm:
      width: 216
      height: 216
      scope: [categories, products]
    default_md:
      width: 261
      height: 261
      scope: [manufacturers, suppliers, products, categories]
    default_lg:
      width: 336
      height: 336
      scope: [categories, products]
    default_xl:
      width: 400
      height: 400
      scope: [products]
    product_main:
      width: 720
      height: 720
      scope: [products]
    category_cover:
      width: 1000
      height: 200
      scope: [categories]
    product_main_2x:
      width: 1440
      height: 1440
      scope: [products]
    category_cover_2x:
      width: 2000
      height: 400
      scope: [categories]

theme_settings:
  rtl_generation: false
  default_layout: layout-full-width
  layouts:
    category: layout-full-width
    best-sales: layout-full-width
    new-products: layout-full-width
    prices-drop: layout-full-width
    contact: layout-left-column
    manufacturer: layout-full-width
    supplier: layout-full-width
